name: Weekly Paper Discovery

on:
  schedule:
    - cron: "0 2 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Set candidate file
        id: discovery
        run: echo "candidate_file=data/candidates/$(date -u +%Y-%m-%d).json" >> "$GITHUB_OUTPUT"

      - name: Discover candidate papers
        env:
          CANDIDATE_FILE: ${{ steps.discovery.outputs.candidate_file }}
          OPENALEX_MAILTO: ${{ secrets.OPENALEX_MAILTO }}
          SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
        run: python3 scripts/discover_papers.py --output "$CANDIDATE_FILE"

      - name: Check candidate count
        id: candidates
        env:
          CANDIDATE_FILE: ${{ steps.discovery.outputs.candidate_file }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          from pathlib import Path
          data = json.loads(Path(os.environ["CANDIDATE_FILE"]).read_text())
          print(f"count={len(data.get('candidates', []))}")
          PY

      - name: Stop when no candidates are found
        if: steps.candidates.outputs.count == '0'
        run: echo "No new candidate papers found."

      - name: Publish discovery branch
        if: steps.candidates.outputs.count != '0'
        env:
          CANDIDATE_FILE: ${{ steps.discovery.outputs.candidate_file }}
          GH_TOKEN: ${{ github.token }}
          COUNT: ${{ steps.candidates.outputs.count }}
        run: |
          set -euo pipefail
          branch="paper-discovery/$(date -u +%Y-%m-%d)-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add "$CANDIDATE_FILE"
          if git diff --cached --quiet; then
            echo "Candidate file did not change."
            exit 0
          fi
          git commit -m "Add weekly paper discovery candidates"
          git push --set-upstream origin "$branch"
          body="This PR contains $COUNT automatically discovered candidate papers in $CANDIDATE_FILE. Set every decision to accept or reject. After the reviewed PR is merged, accepted papers and README.md are updated automatically."

          if gh pr create \
            --title "Weekly paper discovery candidates ($(date -u +%Y-%m-%d))" \
            --body "$body" \
            --base main \
            --head "$branch"; then
            echo "Created discovery pull request."
          else
            compare_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/main...${branch}?expand=1"
            {
              echo "## Weekly paper discovery candidates"
              echo
              echo "GitHub Actions could not create a pull request with the repository token."
              echo
              echo "- Candidate branch: \`$branch\`"
              echo "- Candidate count: \`$COUNT\`"
              echo "- Create PR manually: $compare_url"
              echo
              echo "This usually means the repository or organization setting does not allow GitHub Actions to create pull requests."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "PR creation is not permitted. Candidate branch was pushed: $branch"
          fi
