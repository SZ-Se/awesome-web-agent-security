name: Validate Paper Repository

on:
  push:
    paths:
      - "data/**"
      - "scripts/**"
      - "README.md"
      - ".github/workflows/update-readme.yml"
  pull_request:
    paths:
      - "data/**"
      - "scripts/**"
      - "README.md"
      - ".github/workflows/update-readme.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Validate paper data
        run: python3 scripts/validate_data.py

      - name: Regenerate README
        run: python3 scripts/generate_readme.py

      - name: Ensure generated README is committed
        run: git diff --exit-code README.md
